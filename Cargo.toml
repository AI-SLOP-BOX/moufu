[workspace]
resolver = "2"
members = [
    "crates/moufu-protocol",
    "crates/moufu-core",
    "crates/moufu-adapter-sdk",
    "crates/moufu-gui",
    "examples/mock-amata",
    "examples/mock-kagari",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Moufu Contributors"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
tokio = { version = "1.40", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.10", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1.0"
anyhow = "1.0"
futures = "0.3"
async-trait = "0.1"
eframe = "0.28"
egui = "0.28"
